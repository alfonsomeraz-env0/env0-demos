# Runs 1 and 2: delete the requiresApproval lines
environments:
  bootstrap:
    name: "Bootstrap"
    templateName: "noop"
    workspace: "bootstrap"
    requiresApproval: true
  svc-a:
    name: "Service A"
    templateName: "noop"
    workspace: "svc-a"
